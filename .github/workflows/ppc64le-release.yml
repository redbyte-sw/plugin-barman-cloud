# Downstream (redByte-sw) release of the plugin with linux/ppc64le support.
#
# Upstream publishes through `task publish`, which hardcodes ghcr.io/${GITHUB_REPOSITORY};
# in the redByte-sw fork that name contains uppercase letters and is not a valid image
# reference. This workflow builds the same Dockerfiles directly.
#
# Trigger: push a tag named ppc64le-v<upstream version>, e.g. ppc64le-v0.15.0.
# Result:  ghcr.io/<owner>/plugin-barman-cloud:v<version>
#          ghcr.io/<owner>/plugin-barman-cloud-sidecar:v<version>
#          manifest.yaml (workflow artifact) pointing at both images
name: ppc64le-release
on:
  push:
    tags:
      - ppc64le-v*

permissions: read-all

env:
  PLATFORMS: linux/amd64,linux/arm64,linux/ppc64le

jobs:
  images:
    name: Build and push plugin images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build meta
        run: |
          # ppc64le-v0.15.0 -> v0.15.0 (upstream tags plugin images with the leading v)
          version=${GITHUB_REF_NAME#ppc64le-}
          registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}
          # same rule as GO_VERSION in Taskfile.yml
          go_version=$(sed -n 's/^toolchain go//p' go.mod | grep . || sed -n 's/^go //p' go.mod)
          echo "VERSION=${version}" >> $GITHUB_ENV
          echo "GO_VERSION=${go_version}" >> $GITHUB_ENV
          echo "PLUGIN_IMAGE=${registry}/plugin-barman-cloud:${version}" >> $GITHUB_ENV
          echo "SIDECAR_IMAGE=${registry}/plugin-barman-cloud-sidecar:${version}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/arm64,linux/ppc64le

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login into ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push plugin
        run: >
          docker buildx build --push --platform "${PLATFORMS}"
          --file containers/Dockerfile.plugin --build-arg GO_VERSION="${GO_VERSION}"
          --tag "${PLUGIN_IMAGE}" .

      - name: Build and push sidecar
        run: >
          docker buildx build --push --platform "${PLATFORMS}"
          --file containers/Dockerfile.sidecar --build-arg GO_VERSION="${GO_VERSION}"
          --tag "${SIDECAR_IMAGE}" .

      - name: Generate manifest
        run: |
          # Same approach as upstream's manifest-internal task: patch a copy of kubernetes/
          # (it sits next to kubernetes/, so its ../config references stay valid).
          rm -rf manifest-build && cp -r kubernetes manifest-build
          cd manifest-build
          kustomize edit set image "plugin-barman-cloud=${PLUGIN_IMAGE}"
          sed -i "s|SIDECAR_IMAGE=.*|SIDECAR_IMAGE=${SIDECAR_IMAGE}|" kustomization.yaml
          kustomize build . > ../manifest.yaml
          echo "### Images" >> $GITHUB_STEP_SUMMARY
          echo "- \`${PLUGIN_IMAGE}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${SIDECAR_IMAGE}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload manifest
        uses: actions/upload-artifact@v7
        with:
          name: manifest-${{ env.VERSION }}
          path: manifest.yaml
